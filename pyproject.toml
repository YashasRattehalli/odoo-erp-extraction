[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-erp-extraction"
version = "1.0.0"
description = "Resilient, HIPAA-aware extraction of Odoo invoice lines via Playwright, with in-memory PHI sanitization."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Yashas Rattehalli" }]
keywords = ["odoo", "playwright", "automation", "hipaa", "presidio", "phi", "erp"]

dependencies = [
  "playwright>=1.44,<2.0",
  "presidio-analyzer>=2.2.355,<3.0",
  "presidio-anonymizer>=2.2.355,<3.0",
  "spacy>=3.7,<3.9",
  "click>=8.1,<9.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1,<3.0",
  "python-dotenv>=1.0,<2.0",
  "weasyprint>=60",
  "jinja2>=3.1,<4.0",
  "pygments>=2.17,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
odoo-extract = "odoo_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
